[project]
name = "investment-pipeline"
version = "0.1.0"
description = "Evidence-grounded seed-stage investment triage pipeline (YC + Hacker News sourcing)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "typer>=0.12",
]

[project.scripts]
pipeline = "investment_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: function-call argument defaults are Typer's standard pattern
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
